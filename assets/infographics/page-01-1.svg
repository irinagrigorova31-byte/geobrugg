<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" role="img" aria-labelledby="ttl1 desc1" font-family="'PT Sans', system-ui, -apple-system, sans-serif">
  <title id="ttl1">Подбор защиты от оползней по характеру склона</title>
  <desc id="desc1">Схема сопоставляет характер склона и угрозу с подходящим методом инженерной защиты.</desc>
  <rect x="0" y="0" width="360" height="392" fill="#ffffff"/>
  <text x="16" y="26" font-family="'Manrope', system-ui, sans-serif" font-size="17" font-weight="800" fill="#141414">Какая защита при каком склоне</text>

  <!-- root -->
  <rect x="90" y="40" width="180" height="34" rx="0" fill="#2b3a8c"/>
  <text x="180" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Характер склона и угроза</text>

  <!-- rows: condition -> solution -->
  <g font-size="12.5" fill="#141414">
    <!-- row 1 -->
    <rect x="12" y="96" width="150" height="44" fill="#dde0e6"/>
    <text x="20" y="114">Приповерхностная</text>
    <text x="20" y="130">нестабильность</text>
    <path d="M164 118 L196 118" stroke="#5f6266" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="198" y="96" width="150" height="44" fill="#ffffff" stroke="#c9ccd4"/>
    <text x="206" y="114" font-weight="700">Гибкие сетки</text>
    <text x="206" y="130">TECCO / SPIDER</text>

    <!-- row 2 -->
    <rect x="12" y="150" width="150" height="44" fill="#dde0e6"/>
    <text x="20" y="176">Глубокий оползень</text>
    <path d="M164 172 L196 172" stroke="#5f6266" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="198" y="150" width="150" height="44" fill="#ffffff" stroke="#c9ccd4"/>
    <text x="206" y="168" font-weight="700">Сваи, дренаж,</text>
    <text x="206" y="184">удерживающие стены</text>

    <!-- row 3 -->
    <rect x="12" y="204" width="150" height="44" fill="#dde0e6"/>
    <text x="20" y="230">Риск камнепада</text>
    <path d="M164 226 L196 226" stroke="#5f6266" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="198" y="204" width="150" height="44" fill="#ffffff" stroke="#c9ccd4"/>
    <text x="206" y="222" font-weight="700">Барьеры</text>
    <text x="206" y="238">до 3000 / 10 000 кДж</text>

    <!-- row 4 -->
    <rect x="12" y="258" width="150" height="44" fill="#dde0e6"/>
    <text x="20" y="284">Берег, эрозия</text>
    <path d="M164 280 L196 280" stroke="#5f6266" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="198" y="258" width="150" height="44" fill="#ffffff" stroke="#c9ccd4"/>
    <text x="206" y="276" font-weight="700">Берегоукрепление,</text>
    <text x="206" y="292">сетки и анкеры</text>
  </g>

  <!-- note -->
  <rect x="12" y="320" width="336" height="58" fill="#dde0e6"/>
  <text x="20" y="342" font-size="12.5" fill="#141414">Систему и её параметры подбирают по</text>
  <text x="20" y="360" font-size="12.5" fill="#141414">изысканиям и расчёту устойчивости склона.</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#5f6266"/>
    </marker>
  </defs>
</svg>
